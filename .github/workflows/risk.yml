# Labels each PR risk:low, risk:standard or risk:high from the paths it changes
# and posts the `risk` commit status, which branch protection requires. High
# risk fails until an approver comments `/approve <head sha>`; a later push
# changes the head, so the approval no longer matches. The rules and their
# self-test are in .github/scripts/pr-risk.sh.
#
# pull_request_target and issue_comment run this file and the script from the
# default branch, so a PR cannot change its own tier. Neither checks out PR code.
# The pull_request trigger only runs the self-tests of a PR that edits the rules.
name: risk

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - .github/scripts/pr-risk.sh
      - .github/scripts/review-gate.sh
      - .github/workflows/risk.yml
      - .github/workflows/review-gate.yml
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  contents: read

jobs:
  selftest:
    name: selftest
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Self-test risk and review-gate rules
        run: |
          .github/scripts/pr-risk.sh selftest
          .github/scripts/review-gate.sh selftest

  classify:
    name: classify
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/approve'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    concurrency:
      group: risk-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      cancel-in-progress: true
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Self-test path rules
        run: .github/scripts/pr-risk.sh selftest

      - name: Classify and post the risk status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          COMMENT_ID: ${{ github.event.comment.id }}
          # Comma-separated GitHub logins whose /approve comments count.
          APPROVERS: vultuk
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/pr-risk.sh run

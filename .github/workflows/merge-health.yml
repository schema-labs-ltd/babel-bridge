name: Weekly merge health

on:
  schedule:
    # Mondays at 07:00 UTC, covering the seven days before.
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/merge-health.yml"
      - "tools/scripts/merge-health.mjs"
      - "tools/scripts/merge-health.spec.ts"

permissions:
  contents: read

# Scheduled and manual runs share one queue so two first runs cannot both
# create a tracking issue. Pull request dry runs post nothing and cancel freely.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('merge-health-pr-{0}', github.ref) || 'merge-health-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the report
        run: node --test tools/scripts/merge-health.spec.ts
      # Pull requests only print the report to the job summary; the schedule
      # and manual runs comment on the "Weekly merge health" issue.
      - name: Build and post the report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/scripts/merge-health.mjs ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}

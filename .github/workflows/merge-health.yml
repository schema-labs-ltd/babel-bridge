name: Weekly merge health

on:
  schedule:
    # Mondays at 07:00 UTC, covering the seven days before.
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/merge-health.yml"
      - "tools/scripts/merge-health.mjs"
      - "tools/scripts/merge-health.spec.ts"

permissions:
  contents: read

# Scheduled and manual runs share one queue so two first runs cannot both
# create a tracking issue. Pull request dry runs post nothing and cancel freely.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('merge-health-pr-{0}', github.ref) || 'merge-health-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull request runs execute the PR's own script, so they get a read-only
# token in a job of their own and only print the report to the job summary.
# The schedule and manual runs comment on the "Weekly merge health" issue.
jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the report
        run: node --test tools/scripts/merge-health.spec.ts
      - name: Build the report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/scripts/merge-health.mjs --dry-run

  # Only the default branch publishes, so a manual run on an unmerged branch
  # cannot run that branch's script with issues: write. The spec is not run
  # here: tests are low risk, so a test could rewrite the script before it
  # posts. CI and the dry-run job run it with read-only tokens.
  report:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and post the report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/scripts/merge-health.mjs

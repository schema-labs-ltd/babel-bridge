# Required-check pattern: `changes` asks Nx which Apple tasks a change affects
# (tools/scripts/verify-affected.mjs, as verify.yml does), `build` and `ios` do
# the expensive work, and `apple` always reports a status. Require
# `apple / apple`. There is no workflow-level paths filter, because that leaves
# the check pending. A job for an Apple verify task is named by its task key
# (`ios` for ios:verify) and listed in `apple.needs`.
name: apple

on:
  pull_request:
    branches:
      - main
  # The merge queue runs this on the queued merge before it lands.
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: apple-${{ github.event.pull_request.number || github.ref }}
  # Each push to main keeps its own run, which runs every Apple job; a new
  # push to a PR replaces the last.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tasks: ${{ steps.affected.outputs.tasks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Nx
        run: npm ci

      # Nx picks the Apple jobs from the ios project's target inputs, the same
      # way verify.yml picks its jobs. tools/scripts/verify-affected.eval.ts
      # (run by verify.yml) holds the path cases this job used to check. `ios`
      # runs the build and unit tests below and ios:verify.
      - name: Find affected Apple tasks
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/scripts/verify-affected.mjs tasks --workflow=apple

  build:
    name: ${{ matrix.platform }}
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.tasks), 'ios')
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            build_scheme: WhatsAppTranslator
            test_scheme: WhatsAppTranslatorUnitTests
            destination: platform=iOS Simulator,name=iPhone 17,OS=26.5
            only_testing: WhatsAppTranslatorTests
            extra_build_settings: ""
          - platform: macos
            build_scheme: BabelBridgeMac
            test_scheme: BabelBridgeMac
            destination: platform=macOS,arch=arm64
            only_testing: BabelBridgeMacTests
            extra_build_settings: ENABLE_HARDENED_RUNTIME=NO
    env:
      PLATFORM: ${{ matrix.platform }}
      BUILD_SCHEME: ${{ matrix.build_scheme }}
      TEST_SCHEME: ${{ matrix.test_scheme }}
      DESTINATION: ${{ matrix.destination }}
      ONLY_TESTING: ${{ matrix.only_testing }}
      EXTRA_BUILD_SETTINGS: ${{ matrix.extra_build_settings }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk if the runner is low on space
        run: |
          set -eu
          avail_kb=$(df -Pk / | awk 'NR==2 { print $4 }')
          echo "Disk available: $((avail_kb / 1024 / 1024)) GiB"
          if [ "$avail_kb" -lt 26214400 ]; then
            echo "Removing unused Xcode installations to free disk."
            for app in /Applications/Xcode_*.app; do
              [ -e "$app" ] || continue
              case "$app" in
                /Applications/Xcode_26.6.app) ;;
                *) sudo -n rm -rf "$app" ;;
              esac
            done
            avail_kb=$(df -Pk / | awk 'NR==2 { print $4 }')
            echo "Disk available after cleanup: $((avail_kb / 1024 / 1024)) GiB"
          fi

      - name: Select Xcode 26.6
        run: |
          set -eu
          xcode_app="/Applications/Xcode_26.6.app"
          if [ ! -d "${xcode_app}/Contents/Developer" ]; then
            echo "error: Xcode 26.6 is not installed at ${xcode_app}"
            echo "Installed Xcode apps:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
            exit 1
          fi
          sudo -n xcode-select -s "$xcode_app"
          echo "DEVELOPER_DIR=${xcode_app}/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcode_line=$(xcodebuild -version | awk 'NR==1 { print $2 }')
          case "$xcode_line" in
            26.6*) ;;
            *)
              echo "error: expected Xcode 26.6, found ${xcode_line}"
              exit 1
              ;;
          esac
          swift_line=$(xcrun swift --version | grep -F "Swift version" | head -n 1)
          echo "$swift_line"
          case "$swift_line" in
            *"Swift version 6."*) ;;
            *)
              echo "error: expected Swift 6.x"
              exit 1
              ;;
          esac

      - name: Cache XcodeGen
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/xcodegen-2.45.4
          key: xcodegen-2.45.4-${{ runner.os }}-${{ runner.arch }}

      - name: Install XcodeGen 2.45.4
        run: |
          set -eu
          version=2.45.4
          cache="${HOME}/Library/Caches/xcodegen-${version}"
          bin="${cache}/xcodegen/bin/xcodegen"
          if [ ! -x "$bin" ]; then
            rm -rf "$cache"
            mkdir -p "$cache"
            work=$(mktemp -d)
            curl -fsSL -o "$work/xcodegen.zip" \
              "https://github.com/yonaskolb/XcodeGen/releases/download/${version}/xcodegen.zip"
            unzip -q "$work/xcodegen.zip" -d "$cache"
            rm -rf "$work"
            chmod +x "$bin"
          fi
          version_line=$("$bin" --version 2>&1 || true)
          echo "$version_line"
          case "$version_line" in
            *2.45.4*) ;;
            *)
              echo "error: expected XcodeGen 2.45.4"
              exit 1
              ;;
          esac
          echo "XCODEGEN_BIN=${bin}" >> "$GITHUB_ENV"

      - name: Cache SPM and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            .deriveddata
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: derived-${{ matrix.platform }}-${{ runner.os }}-xcode-26.6-${{ hashFiles('apps/ios/**', 'apps/web/public/sounds/**') }}
          restore-keys: |
            derived-${{ matrix.platform }}-${{ runner.os }}-xcode-26.6-

      - name: Generate Xcode project
        id: generate
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/apps/ios"
          "$XCODEGEN_BIN" generate
          if ! git diff --quiet -- WhatsAppTranslator.xcodeproj; then
            echo "error: committed WhatsAppTranslator.xcodeproj differs from XcodeGen 2.45.4"
            git status --porcelain -- WhatsAppTranslator.xcodeproj
            git diff --stat -- WhatsAppTranslator.xcodeproj
            git --no-pager diff -- WhatsAppTranslator.xcodeproj | head -n 160 || true
            exit 1
          fi

      - name: Upload generated project
        if: failure() && steps.generate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: xcodeproj-${{ matrix.platform }}
          path: apps/ios/WhatsAppTranslator.xcodeproj
          if-no-files-found: ignore

      - name: Check destination
        run: |
          set -eu
          if [ "$PLATFORM" = "ios" ]; then
            if ! xcrun simctl list devices available | awk '
              /^-- iOS 26.5 --/ { section = 1; next }
              /^-- / { section = 0 }
              section && $0 ~ /^[[:space:]]*iPhone 17 \(/ { found = 1 }
              END { exit found ? 0 : 1 }
            '; then
              echo "error: iPhone 17 simulator for iOS 26.5 is not installed on this image."
              xcrun simctl list devices available
              exit 1
            fi
            echo "Using iPhone 17 simulator on iOS 26.5."
          else
            machine=$(uname -m)
            if [ "$machine" != "arm64" ]; then
              echo "error: BabelBridgeMac expects an arm64 runner, found ${machine}."
              exit 1
            fi
            echo "Using macOS arm64."
          fi

      - name: xcodebuild build
        run: |
          set -eu
          derived="${GITHUB_WORKSPACE}/.deriveddata/${PLATFORM}"
          mkdir -p "$derived"
          logfile="${RUNNER_TEMP}/xcodebuild-${PLATFORM}-build.log"
          cd "$GITHUB_WORKSPACE/apps/ios"
          args=(
            build
            -project WhatsAppTranslator.xcodeproj
            -scheme "$BUILD_SCHEME"
            -configuration Debug
            -destination "$DESTINATION"
            -derivedDataPath "$derived"
            -jobs 2
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            "CODE_SIGN_IDENTITY="
            "DEVELOPMENT_TEAM="
            CODE_SIGN_STYLE=Manual
            "CODE_SIGN_ENTITLEMENTS="
            COMPILER_INDEX_STORE_ENABLE=NO
            ENABLE_PREVIEWS=NO
          )
          if [ -n "${EXTRA_BUILD_SETTINGS:-}" ]; then
            args+=("$EXTRA_BUILD_SETTINGS")
          fi
          echo "xcodebuild build -scheme ${BUILD_SCHEME} -destination ${DESTINATION}"
          set +e
          xcodebuild "${args[@]}" 2>&1 | tee "$logfile"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "xcodebuild build failed with status ${status}"
            grep -E "error:|fatal error:|BUILD FAILED" "$logfile" | tail -n 80 || true
            tail -n 40 "$logfile"
            exit "$status"
          fi
          if ! grep -q "BUILD SUCCEEDED" "$logfile"; then
            echo "error: xcodebuild build did not succeed"
            tail -n 40 "$logfile"
            exit 1
          fi
          echo "xcodebuild build succeeded for ${BUILD_SCHEME}"

      - name: xcodebuild test
        id: test
        env:
          # xcodebuild passes TEST_RUNNER_* to the tests without the prefix.
          # Tests that need real audio output skip on CI's cold simulators.
          TEST_RUNNER_SKIP_AUDIO_PLAYBACK: "1"
        run: |
          set -eu
          derived="${GITHUB_WORKSPACE}/.deriveddata/${PLATFORM}"
          mkdir -p "$derived"
          logfile="${RUNNER_TEMP}/xcodebuild-${PLATFORM}-test.log"
          result_bundle="${RUNNER_TEMP}/test-results/${PLATFORM}.xcresult"
          rm -rf "$result_bundle"
          echo "RESULT_BUNDLE=${result_bundle}" >> "$GITHUB_ENV"
          echo "TEST_LOG=${logfile}" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE/apps/ios"
          args=(
            test
            -project WhatsAppTranslator.xcodeproj
            -scheme "$TEST_SCHEME"
            -configuration Debug
            -destination "$DESTINATION"
            -derivedDataPath "$derived"
            -resultBundlePath "$result_bundle"
            -only-testing:"$ONLY_TESTING"
            -jobs 2
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            "CODE_SIGN_IDENTITY="
            "DEVELOPMENT_TEAM="
            CODE_SIGN_STYLE=Manual
            "CODE_SIGN_ENTITLEMENTS="
            COMPILER_INDEX_STORE_ENABLE=NO
            ENABLE_PREVIEWS=NO
          )
          if [ -n "${EXTRA_BUILD_SETTINGS:-}" ]; then
            args+=("$EXTRA_BUILD_SETTINGS")
          fi
          echo "xcodebuild test -scheme ${TEST_SCHEME} -destination ${DESTINATION} -only-testing:${ONLY_TESTING}"
          set +e
          xcodebuild "${args[@]}" 2>&1 | tee "$logfile"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "xcodebuild test failed with status ${status}"
            grep -E "error:|fatal error:|failed|Executed [0-9]+ tests?" "$logfile" | tail -n 120 || true
            tail -n 60 "$logfile"
            exit "$status"
          fi
          count_line=$(grep -E "Executed [0-9]+ tests?" "$logfile" | tail -n 1 || true)
          echo "xcodebuild test count: ${count_line}"
          count=$(printf '%s\n' "$count_line" | sed -nE 's/.*Executed ([0-9]+) tests?.*/\1/p')
          if [ -z "$count" ] || [ "$count" -eq 0 ]; then
            echo "error: xcodebuild test did not report any tests"
            tail -n 40 "$logfile"
            exit 1
          fi

      # Agents read CI logs through the API and only see the last lines, so put
      # the failing tests in the step summary and keep the full result bundle.
      - name: Summarize test failures
        if: failure() && steps.test.outcome == 'failure'
        run: |
          set -u
          {
            echo "## ${PLATFORM} test failures"
            echo
            summary="${RUNNER_TEMP}/xcresult-summary.json"
            if [ -d "${RESULT_BUNDLE:-}" ] && xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" --compact > "$summary" 2>/dev/null; then
              python3 - "$summary" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          failures = data.get("testFailures") or []
          print(f"{data.get('failedTests', len(failures))} failed of {data.get('totalTestCount', '?')} tests.")
          print()
          for failure in failures[:50]:
              name = failure.get("testIdentifierString") or failure.get("testName", "?")
              text = " ".join((failure.get("failureText") or "").split())[:400]
              print(f"- `{failure.get('targetName', '')} {name}`: {text}")
          PY
            else
              echo "No result bundle summary; matching lines from the log:"
              echo
              echo '```'
              grep -E "error: |Test Case .* failed|failed \(" "${TEST_LOG:-/dev/null}" | head -n 50 || true
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/test-results/
            ${{ runner.temp }}/xcodebuild-${{ matrix.platform }}-test.log
          if-no-files-found: ignore
          retention-days: 14

  # ios:verify (issue #138, section 6): the unsigned Release archives Xcode
  # Cloud would build, and the UI test suites, one part per job.
  ios:
    name: ios (${{ matrix.part }})
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.tasks), 'ios')
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [archive-ios, archive-mac, ui-ios, ui-watch]
    env:
      VERIFY_IOS_PART: ${{ matrix.part }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disk if the runner is low on space
        run: |
          set -eu
          avail_kb=$(df -Pk / | awk 'NR==2 { print $4 }')
          echo "Disk available: $((avail_kb / 1024 / 1024)) GiB"
          if [ "$avail_kb" -lt 26214400 ]; then
            for app in /Applications/Xcode_*.app; do
              [ -e "$app" ] || continue
              case "$app" in
                /Applications/Xcode_26.6.app) ;;
                *) sudo -n rm -rf "$app" ;;
              esac
            done
            avail_kb=$(df -Pk / | awk 'NR==2 { print $4 }')
            echo "Disk available after cleanup: $((avail_kb / 1024 / 1024)) GiB"
          fi

      - name: Select Xcode 26.6
        run: |
          set -eu
          xcode_app="/Applications/Xcode_26.6.app"
          if [ ! -d "${xcode_app}/Contents/Developer" ]; then
            echo "error: Xcode 26.6 is not installed at ${xcode_app}"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
            exit 1
          fi
          sudo -n xcode-select -s "$xcode_app"
          echo "DEVELOPER_DIR=${xcode_app}/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Nx
        run: npm ci

      # No DerivedData cache: four more caches of Release intermediates would
      # push the build job's caches out of the repository's 10 GB, and the
      # project has no Swift packages to cache.
      - name: Run ios:verify
        env:
          # As the build job: tests that need real audio output skip on CI's
          # cold simulators.
          TEST_RUNNER_SKIP_AUDIO_PLAYBACK: "1"
        run: npx nx run ios:verify --outputStyle=stream

      - name: Upload evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-ios-${{ matrix.part }}
          path: |
            output/verify/ios/*.log
            output/verify/ios/*.xcresult
          if-no-files-found: ignore
          retention-days: 14

  apple:
    name: apple
    needs: [changes, build, ios]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: tools/scripts
          sparse-checkout-cone-mode: true

      # Every affected Apple task's job must pass and every other job must be
      # skipped. `build` runs with `ios`, so it must succeed or be skipped.
      - name: Report Apple check
        env:
          TASKS: ${{ needs.changes.outputs.tasks || '[]' }}
          NEEDS: ${{ toJSON(needs) }}
        run: node tools/scripts/verify-affected.mjs report

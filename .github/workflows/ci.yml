name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check production Rust container build
        run: docker build --target rust-builder --tag whatsapp-translator:rust-build-check .

  api-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Rust side of the contract runs in `cargo test` below. This decodes
      # the same fixtures with the app's APIModels.swift.
      - name: Decode API fixtures with the app models
        run: |
          swiftc --version
          scripts/check-api-contract.sh

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: wa-bridge/go.mod
          cache-dependency-path: wa-bridge/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test Go bridge
        working-directory: wa-bridge
        run: go test ./...

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Install audio conversion dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test Rust backend
        run: cargo test

      - name: Run Rust clippy
        run: cargo clippy

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Test frontend
        working-directory: web
        run: npm test

      - name: Check Extension types and committed resource
        working-directory: web
        run: npm run lint:extension && npm run typecheck:extension && npm run check:extension

      - name: Install Extension browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Test Extension host bridge and UI
        working-directory: web
        run: CHROMIUM_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" npm run test:extension

      - name: Upload Extension screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-browser-evidence
          path: output/playwright/

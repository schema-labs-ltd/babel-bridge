# Posts the `review-gate` commit status, which branch protection requires, so
# auto-merge waits for the bot reviews. It passes once Copilot has reviewed the
# head commit and Codex has reviewed the PR, reported a finished review in a
# comment, or +1'd it. The rules and their self-test are in
# .github/scripts/review-gate.sh.
#
# A new head polls for up to 15 minutes. The schedule catches later reviews
# and reactions. Only default-branch workflows can access the merge-gates
# environment's App key; see docs/merge-gates.md for the required settings.
name: review-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (empty checks every open PR)
        required: false

permissions:
  contents: read

jobs:
  evaluate:
    name: evaluate
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: merge-gates
    concurrency:
      group: review-gate-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr || 'all' }}
      cancel-in-progress: true
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Self-test review rules
        run: .github/scripts/review-gate.sh selftest

      - name: Create gate App token
        id: gate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.MERGE_GATES_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_GATES_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-statuses: write

      - name: Evaluate and post the review-gate status
        env:
          GH_TOKEN: ${{ steps.gate-token.outputs.token }}
          STATUS_CREATOR: ${{ steps.gate-token.outputs.app-slug }}[bot]
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          POLL_SECONDS: ${{ github.event_name == 'pull_request_target' && '900' || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/review-gate.sh run

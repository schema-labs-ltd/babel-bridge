name: WhatsAppTranslator
options:
  bundleIdPrefix: com.vultuk
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: SUR6QUSSV6
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 74
    MARKETING_VERSION: 1.0.0
targets:
  WhatsAppTranslator:
    type: application
    platform: iOS
    sources:
      - path: WhatsAppTranslator
      - path: Shared/NotificationPersonIdentity.swift
      - path: Shared/PhotoSendActivityAttributes.swift
      - path: Shared/MessagingIntentModels.swift
      - path: Shared/WatchMessagingModels.swift
      - path: Shared/WatchMessageTransport.swift
      - path: ../web/public/sounds
        buildPhase: resources
    dependencies:
      - target: WhatsAppTranslatorNotificationService
        embed: true
      - target: WhatsAppTranslatorIntents
        embed: true
      - target: WhatsAppTranslatorSendActivity
        embed: true
      - target: BabelBridgeWatch
        embed: true
    entitlements:
      path: WhatsAppTranslator/WhatsAppTranslator.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.siri: true
        com.apple.developer.carplay-communication: true
        com.apple.developer.usernotifications.communication: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
          - $(AppIdentifierPrefix)com.vultuk.whatsapptranslator.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultuk.whatsapptranslator
        PRODUCT_NAME: WhatsAppTranslator
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-paperBridge AppIcon-neonOrbit AppIcon-sunrise AppIcon-porcelain AppIcon-botanical AppIcon-pixel AppIcon-ribbon AppIcon-mono AppIcon-mosaic AppIcon-cosmic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: WhatsAppTranslator/Info.plist
      properties:
        CFBundleDisplayName: Babel Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Record voice notes to translate and send in the conversation language.
        NSLocalNetworkUsageDescription: Connect to your self-hosted Babel Bridge backend.
        NSSiriUsageDescription: Send and read translated messages with Siri, Apple Watch, and CarPlay.
        KeychainAccessGroup: $(AppIdentifierPrefix)com.vultuk.whatsapptranslator.shared
        NSUserActivityTypes:
          - INSendMessageIntent
          - INSearchForMessagesIntent
          - INSetMessageAttributeIntent
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneClassName: CPTemplateApplicationScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - audio
          - remote-notification
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  WhatsAppTranslatorNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: WhatsAppTranslatorNotificationService
      - path: Shared/NotificationPersonIdentity.swift
      - path: ../web/public/sounds
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultuk.whatsapptranslator.notification-service
        PRODUCT_NAME: NotificationService
        SKIP_INSTALL: true
    info:
      path: WhatsAppTranslatorNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Babel Bridge Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  WhatsAppTranslatorSendActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: WhatsAppTranslatorSendActivity
      - path: Shared/PhotoSendActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultuk.whatsapptranslator.send-activity
        PRODUCT_NAME: PhotoSendActivity
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
    info:
      path: WhatsAppTranslatorSendActivity/Info.plist
      properties:
        CFBundleDisplayName: Babel Bridge Photo Send
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  WhatsAppTranslatorIntents:
    type: app-extension
    platform: iOS
    sources:
      - path: WhatsAppTranslatorIntents
      - path: WhatsAppTranslator/Models/APIModels.swift
      - path: WhatsAppTranslator/Models/ServerConfiguration.swift
      - path: WhatsAppTranslator/Models/MessageTone.swift
      - path: WhatsAppTranslator/Services/APIClient.swift
      - path: WhatsAppTranslator/Services/SendRecoveryStore.swift
      - path: WhatsAppTranslator/Services/CredentialStore.swift
      - path: Shared/MessagingIntentModels.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultuk.whatsapptranslator.intents
        PRODUCT_NAME: WhatsAppTranslatorIntents
        SKIP_INSTALL: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APP_EXTENSION
    entitlements:
      path: WhatsAppTranslatorIntents/WhatsAppTranslatorIntents.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.vultuk.whatsapptranslator.shared
    info:
      path: WhatsAppTranslatorIntents/Info.plist
      properties:
        CFBundleDisplayName: Babel Bridge Messaging
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeychainAccessGroup: $(AppIdentifierPrefix)com.vultuk.whatsapptranslator.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.intents-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).IntentHandler
          NSExtensionAttributes:
            IntentsSupported:
              - INSendMessageIntent
              - INSearchForMessagesIntent
              - INSetMessageAttributeIntent
  BabelBridgeWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: BabelBridgeWatch
      - path: Shared/WatchMessagingModels.swift
      - path: Shared/WatchMessageTransport.swift
    dependencies:
      - target: BabelBridgeWatchComplications
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultuk.whatsapptranslator.watchkitapp
        PRODUCT_NAME: BabelBridgeWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: true
    info:
      path: BabelBridgeWatch/Info.plist
      properties:
        CFBundleDisplayName: Babel Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.vultuk.whatsapptranslator
        WKRunsIndependentlyOfCompanionApp: false
        NSMicrophoneUsageDescription: Dictate replies to your WhatsApp messages.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
  BabelBridgeWatchComplications:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: BabelBridgeWatchComplications
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultuk.whatsapptranslator.watchkitapp.complications
        PRODUCT_NAME: BabelBridgeWatchComplications
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
    info:
      path: BabelBridgeWatchComplications/Info.plist
      properties:
        CFBundleDisplayName: Babel Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  BabelBridgeWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: BabelBridgeWatchUITests
    dependencies:
      - target: BabelBridgeWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultuk.whatsapptranslator.watch-ui-tests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: BabelBridgeWatch
  BabelBridgeMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: WhatsAppTranslator
        excludes:
          - WhatsAppTranslatorApp.swift
          - App/PushNotificationCoordinator.swift
          - App/MessagingIntentDonor.swift
          - App/CarPlaySceneDelegate.swift
          - App/WatchPhoneCoordinator.swift
          - en.lproj/AppIntentVocabulary.plist
          - Info.plist
          - WhatsAppTranslator.entitlements
      - path: BabelBridgeMac
      - path: ../web/public/sounds
        buildPhase: resources
    entitlements:
      path: BabelBridgeMac/BabelBridgeMac.entitlements
      properties:
        com.apple.developer.aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.usernotifications.communication: true
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-only: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
          - $(AppIdentifierPrefix)com.vultuk.whatsapptranslator.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultuk.whatsapptranslator
        PRODUCT_NAME: Babel Bridge
        PRODUCT_MODULE_NAME: BabelBridgeMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: true
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: BabelBridgeMac/Info.plist
      properties:
        CFBundleDisplayName: Babel Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        KeychainAccessGroup: $(AppIdentifierPrefix)com.vultuk.whatsapptranslator.shared
        LSApplicationCategoryType: public.app-category.social-networking
        NSMicrophoneUsageDescription: Record voice notes to translate and send in the conversation language.
        NSLocalNetworkUsageDescription: Connect to your self-hosted Babel Bridge backend.
        NSUserActivityTypes:
          - INSendMessageIntent
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHumanReadableCopyright: Copyright © 2026 Simon Skinner. Open source under the repository license.
  WhatsAppTranslatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhatsAppTranslatorTests
      - path: SharedTests/MessageToneTests.swift
      - path: SharedTests/ConversationTranslationTests.swift
      - path: SharedTests/ReactionDeliveryTests.swift
      - path: SharedTests/MessageEditDeliveryTests.swift
      - path: SharedTests/WhatsAppConnectionTests.swift
      - path: SharedTests/ChatMediaGalleryTests.swift
      - path: SharedTests/ImagePasteTests.swift
      - path: SharedTests/AppIconTests.swift
    dependencies:
      - target: WhatsAppTranslator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultuk.whatsapptranslator.tests
        GENERATE_INFOPLIST_FILE: true
  ConversationTranslationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ConversationTranslationUITests
    dependencies:
      - target: WhatsAppTranslator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultuk.whatsapptranslator.conversation-ui-tests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: WhatsAppTranslator
  BabelBridgeMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: BabelBridgeMacTests
      - path: SharedTests/MessageToneTests.swift
      - path: SharedTests/ConversationTranslationTests.swift
      - path: SharedTests/ReactionDeliveryTests.swift
      - path: SharedTests/MessageEditDeliveryTests.swift
      - path: SharedTests/WhatsAppConnectionTests.swift
      - path: SharedTests/ChatMediaGalleryTests.swift
      - path: SharedTests/ImagePasteTests.swift
      - path: SharedTests/AppIconTests.swift
    dependencies:
      - target: BabelBridgeMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultuk.whatsapptranslator.macos-tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Babel Bridge.app/Contents/MacOS/Babel Bridge
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  BabelBridgeWatch:
    build:
      targets:
        BabelBridgeWatch: all
        BabelBridgeWatchUITests: [test]
    test:
      targets:
        - name: BabelBridgeWatchUITests
          parallelizable: false
  WhatsAppTranslator:
    build:
      targets:
        WhatsAppTranslator: all
        WhatsAppTranslatorTests: [test]
        ConversationTranslationUITests: [test]
    test:
      targets:
        - name: WhatsAppTranslatorTests
          parallelizable: false
        - name: ConversationTranslationUITests
          parallelizable: false
  WhatsAppTranslatorUnitTests:
    build:
      targets:
        WhatsAppTranslator: all
        WhatsAppTranslatorTests: [test]
    test:
      targets:
        - name: WhatsAppTranslatorTests
          parallelizable: false
  BabelBridgeMac:
    build:
      targets:
        BabelBridgeMac: all
        BabelBridgeMacTests: [test]
    test:
      targets:
        - name: BabelBridgeMacTests
          parallelizable: false
